[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wwpdb.apps.ann_tasks_v2"
dynamic = ["version"]
description = "wwPDB annotation/review/status/validation module backend"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Ezra Peisach", email = "ezra.peisach@rcsb.org" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
]
dependencies = [
    "matplotlib",
    "mmcif >= 0.25",
    "mmcif.utils >= 0.22",
    "pygal",
    "wwpdb.apps.wf_engine",
    "wwpdb.io",
    "wwpdb.utils.config >= 0.45",
    "wwpdb.utils.db[status] >= 0.6",
    "wwpdb.utils.detach",
    "wwpdb.utils.dp >= 0.54",
    "wwpdb.utils.emdb ~= 1.0",
    "wwpdb.utils.nmr >= 0.24",
    "wwpdb.utils.session",
    "wwpdb.utils.wf >= 0.13",
]

requires-python = ">=3.8"


[project.urls]
Homepage = "https://github.com/rcsb/py-wwpdb_apps_ann_tasks_v2"

[tool.hatch.version]
path = "wwpdb/apps/ann_tasks_v2/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/wwpdb",
]

[tool.hatch.build.targets.wheel]
packages = ["wwpdb"]

[tool.ruff]
target-version = "py38"
output-format = "concise"

line-length = 180 # 120 is hatch's default via 'hatch init'
include = [
  "*.py",           # Source
  "pyproject.toml", # This file (RUF rules only)
  "*.ipynb",        # Jupyter notebooks
]

#=================================== Ruff lint ==============================#
[tool.ruff.lint]

#
# ------------------------- Ruff misc. options ----------------------
preview = false
explicit-preview-rules = true

ignore = [
  "D419",     # Docstring is empty
  "FBT002",   # Boolean default positional argument in function definition
  "FURB122",  # for-loop-writes
  "ISC003",   # (explicit-string-concatenation)
  "N801",     # Class name `markdownTests` should use CapWords convention
  "N802",     # Function name should be lowercase
  "N803",     # Argument name should be lowercase
  "N806",     # in function should be lowercase
  "N813",     # Camelcase `cPickle` imported as lowercase `pickle`
  "N815",     # Variable `_styleId` in class scope should not be mixedCase
  "N816",     # Variable in global scope should not be mixedCase
  "N999",     # Invalid module name,
  "PERF401",  # Use a list comprehension to create a transformed list
  "PLR2044",  # Do not remove empty comment
  "RET504",   # Unnecessary assignment to `X` before `return` statement
  "RUF100",   # RUF REMOVES FLAKE8 noqa!
  "RUF005",   # Consider iterable unpacking instead of concatenation  
  "S110",     # `try`-`except`-`pass` detected, consider logging the exception
  "SIM102",   # Use a single `if` statement instead of nested `if` statements
  "SIM103",   #  Return the condition directly
  "SIM108",   # Use ternary operator
  "SIM115",   # Use a context manager for opening files
  "SIM118",   # Do not remove .keys()
  "SIM116",
  "SIM113",   # Use `enumerate()` for index variable `iCol` in `for` loop
  "SIM401",   # if-else-blocks-instead-of-dict-get
  "TRY300",   # Consider moving this statement to an `else` block
  "TRY400",   # Use `logging.exception` instead of `logging.error`
  "UP008",    # Use `super()` instead of `super(__class__, self)`
  "UP015",    # redundant-open-modes
  "UP031",    # Use format specifiers instead of percent format
]


# -------------------- default environment scripts ------------------
[tool.hatch.envs.default]
python = "3.10"

# skip-install = true
dependencies = ["mypy", "ruff >=0.6.9", "wwpdb.utils.testing", "matplotlib", "pygal",
  "wwpdb.utils.config",
  "wwpdb.io"]


[tool.hatch.envs.default.scripts]

# 'format' formats and fixes issues but does not complain
format = [
  "ruff format",
  "ruff check --fix-only",
]

# 'format-python' just excludes Prettier
format-python = ["ruff format", "ruff check --fix-only"]

# 'check' only checks but never fixes
check = ["ruff check --no-fix .", "mypy --non-interactive --install-types -p wwpdb -p tests"]

# only checks with ruff (mypy has a lot of false positives)
check-ruff = "ruff check --no-fix . {args}"

# to complement 'check-ruff'
check-mypy = "mypy --non-interactive --install-types -p wwpdb -p tests {args}"

# only check security via Bandit; we require these rules to pass
check-security = "ruff check --select S --no-fix ."


# ------------------------ ruff disable per file
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT009", "TID252"]
"wwpdb/apps/ann_tasks_v2/report/PdbxReportDepictBootstrap.py" = ["PLR2004"]  # magic constants



# -------------------------  Mypy disable ---------
[[tool.mypy.overrides]]
module = ["mmcif.*", "wwpdb.apps.msgmodule.*", "wwpdb.apps.wf_engine.*",
          "wwpdb.apps.validation.*", "cPickle", "commonsetup", "pygal.*"]
ignore_missing_imports = true

